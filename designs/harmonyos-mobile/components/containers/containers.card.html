<!-- @dsCard group="Components" viewport="780x960" name="Containers" subtitle="CardView · List · Divider" -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Containers</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body class="hm-host">
<div id="root"></div>
<script type="text/babel">
const { CardView, List, Divider, Icon } = window.HarmonyosMobile_c16f53;

const ART = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" rx="12" fill="#0a59f7"/></svg>');

function Panel({ label, children }) {
  return (
    <div style={{ marginBottom: 26 }}>
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: ".06em", textTransform: "uppercase",
                    color: "var(--harmony-font-tertiary)", marginBottom: 10 }}>{label}</div>
      {children}
    </div>
  );
}

function ContainersCard() {
  const [picked, setPicked] = React.useState(0);
  return (
    <div style={{ width: 660 }}>
      <Panel label="List — all six documented variants (48 / 56 / 64 / 64 / 72 / 96)">
        <div className="hm-cardview hm-cardview--max" style={{ padding: "4px 0" }}>
          <List variant="single" title="单行 · 48px" rightText="值" rightIcon="arrow-down" />
          <List variant="icondot" title="圆点 · 56px" rightText="值" rightIcon="arrow-down" />
          <List variant="iconsingle" appIconSrc={ART} title="应用图标 · 64px" rightText="值" rightIcon="arrow-down" />
          <List variant="2lines" title="两行 · 64px" aux="辅助说明文字" rightText="右侧两行" rightIcon="chevron" />
          <List variant="icon2lines" appIconSrc={ART} title="图标两行 · 72px" aux="辅助说明文字"
                rightText="服务器优先" rightIcon="chevron" onClick={() => setPicked(picked + 1)} />
          <List variant="3lines" title="三行 · 96px" aux="第一行辅助" aux2="第二行辅助"
                rightText="右侧两行文本会被截断" rightIcon="chevron" />
        </div>
      </Panel>

      <Panel label="Divider — full / inset / block / vertical">
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Divider />
          <Divider variant="inset" />
          <Divider variant="block" />
          <div style={{ display: "flex", alignItems: "center", gap: 14, height: 24 }}>
            <span>左</span><Divider variant="vertical" /><span>右</span>
          </div>
        </div>
      </Panel>

      <Panel label="CardView — mini / small / medium / larger / max">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 14, alignItems: "flex-start" }}>
          <CardView size="mini"><span style={{ padding: 8, display: "block" }}>mini</span></CardView>
          <CardView size="small"><span style={{ padding: 8, display: "block" }}>small</span></CardView>
          <CardView size="medium"
            iconButtons={[{ position: "br", glyph: "arrow_up_and_rectangle_on_rectangle", label: "导出" }]}>
            <span style={{ padding: 8, display: "block" }}>medium + br 按钮</span>
          </CardView>
          <CardView size="larger"
            iconButtons={[{ position: "left", glyph: "chevron_left", label: "返回" },
                          { position: "right", glyph: "more", label: "更多" }]}>
            <span style={{ padding: 8, display: "block" }}>larger + 左右按钮</span>
          </CardView>
          <CardView size="max"><span style={{ padding: 8, display: "block" }}>max</span></CardView>
        </div>
      </Panel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ContainersCard />);
</script>
</body>
</html>
