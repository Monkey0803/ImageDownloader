<!-- @dsCard group="Foundations" viewport="780x420" name="Control heights" subtitle="The six locked control heights" -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Control heights</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body class="hm-host">
<div class="hm-spec">
<div class="hm-spec__section">
  <div class="hm-spec__label">控件高度 · 锁定档位</div>
  <div class="hm-spec__note">控件高度是锁定值，不从内容推导。搜索框 40、胶囊底栏 56、标题栏动作按钮 40 —— 都已由各自组件消费。</div>
  <table>
    <tr><th>Token</th><th>值</th><th>消费方</th><th>实测</th></tr>
    <tr><td>control-height-28</td><td><code>28px</code></td><td>Switch 轨道 / Home Indicator 区</td><td><div style="height:var(--harmony-control-height-28);width:96px;border-radius:14px;background:var(--harmony-brand)"></div></td></tr>
    <tr><td>control-height-36</td><td><code>36px</code></td><td>小按钮</td><td><div style="height:var(--harmony-control-height-36);width:96px;border-radius:18px;background:var(--harmony-brand)"></div></td></tr>
    <tr><td>control-height-40</td><td><code>40px</code></td><td>中按钮 / 搜索 / 标题栏圆形按钮</td><td><div style="height:var(--harmony-control-height-40);width:96px;border-radius:20px;background:var(--harmony-brand)"></div></td></tr>
    <tr><td>control-height-56</td><td><code>56px</code></td><td>底部胶囊栏</td><td><div style="height:var(--harmony-control-height-56);width:96px;border-radius:28px;background:var(--harmony-brand)"></div></td></tr>
    <tr><td>control-height-64</td><td><code>64px</code></td><td>大按钮 / 工具栏</td><td><div style="height:var(--harmony-control-height-64);width:96px;border-radius:32px;background:var(--harmony-brand)"></div></td></tr>
    <tr><td>control-height-72</td><td><code>72px</code></td><td>扩展行 / 播放条</td><td><div style="height:var(--harmony-control-height-72);width:96px;border-radius:36px;background:var(--harmony-brand)"></div></td></tr>
  </table>
</div>
</div>
</body>
</html>
